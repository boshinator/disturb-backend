<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISTURB | Enterprise Telemetry</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            padding: 40px;
        }
        header {
            margin-bottom: 50px;
            border-bottom: 2px solid #3b82f6; /* Strong Blue */
            padding-bottom: 20px;
        }
        h1 {
            font-size: 48px;
            font-style: italic;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
        }
        h2 {
            color: #bfdbfe; /* Soft Blue */
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .metric-card {
            border: 1px solid #1e3a8a; /* Dark Blue Border */
            padding: 30px;
            background: #050510;
        }
        .metric-title {
            font-size: 14px;
            color: #bfdbfe; /* Soft Blue */
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .metric-value {
            font-size: 64px;
            color: #3b82f6; /* Strong Blue */
            font-weight: 900;
        }
        .log-section {
            border-top: 1px solid #1e3a8a;
            padding-top: 30px;
        }
        .log-entry {
            padding: 15px 0;
            border-bottom: 1px dashed #1e3a8a;
            display: flex;
            justify-content: space-between;
            color: #e0e7ff; 
        }
        .status-locked { color: #ffffff; font-weight: bold; }
        .status-awake { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>DISTURB.</h1>
        <h2>ENTERPRISE TELEMETRY & COMPLIANCE</h2>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">TOTAL LOCKDOWNS EXECUTED</div>
            <div class="metric-value" id="val-lockdowns">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">TOTAL MINUTES PROTECTED</div>
            <div class="metric-value" id="val-minutes">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">ACTIVE WORKSPACE USERS</div>
            <div class="metric-value" id="val-users">0</div>
        </div>
    </div>

    <div class="log-section">
        <h3 style="margin-bottom: 20px; color: #bfdbfe;">LIVE SYSTEM LOG</h3>
        <div id="log-container">
            <!-- Logs will inject here -->
        </div>
    </div>

    <script>
        async function fetchTelemetry() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                // Update large numbers
                document.getElementById('val-lockdowns').innerText = data.metrics.totalLockdownsExecuted;
                document.getElementById('val-minutes').innerText = data.metrics.totalMinutesProtected;
                document.getElementById('val-users').innerText = data.metrics.activeUsers;

                // Build the log list
                const logContainer = document.getElementById('log-container');
                logContainer.innerHTML = ''; 

                // Reverse the logs so the newest is on top
                const reversedLogs = [...data.rawLogs].reverse();

                reversedLogs.forEach(log => {
                    const timeString = new Date(log.timestamp).toLocaleTimeString();
                    const statusClass = log.action === 'LOCKED' ? 'status-locked' : 'status-awake';
                    
                    const logEl = document.createElement('div');
                    logEl.className = 'log-entry';
                    logEl.innerHTML = `
                        <span>[${timeString}] USER: ${log.user}</span>
                        <span class="${statusClass}">${log.action} ${log.action === 'LOCKED' ? `(${log.durationRequested} MIN)` : ''}</span>
                    `;
                    logContainer.appendChild(logEl);
                });

            } catch (error) {
                console.error("Dashboard Sync Failed:", error);
            }
        }

        fetchTelemetry();
        setInterval(fetchTelemetry, 3000);
    </script>
</body>
</html>
